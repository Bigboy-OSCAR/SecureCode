<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local LLM Context Access Experiments</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/slides.css" />
    <link rel="stylesheet" href="./css/visualizers.css" />
  </head>
  <body>
    <div class="deck-shell">
      <header class="deck-topbar" aria-label="Presentation status">
        <div class="deck-title-block">
          <span class="deck-kicker">SecureCode midterm presentation</span>
          <strong id="current-title">Local LLM Context Access Experiments</strong>
        </div>
        <div class="deck-status">
          <span id="slide-counter">1 / 1</span>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>
      </header>

      <main id="deck" class="deck" aria-live="polite"></main>

      <nav class="deck-controls" aria-label="Slide navigation">
        <button id="prev-slide" type="button" aria-label="Previous slide">Prev</button>
        <button id="next-slide" type="button" aria-label="Next slide">Next</button>
      </nav>
    </div>

    <script src="./js/data.js" defer></script>
    <script src="./js/charts.js" defer></script>
    <script src="./js/visualizers.js" defer></script>
    <script src="./js/slides.js" defer></script>
  </body>
</html>
