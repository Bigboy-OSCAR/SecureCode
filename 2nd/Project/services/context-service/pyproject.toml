[project]
name = "securecode-context-service"
version = "0.1.0"
description = "SecureCode Python context service: R0 symbols, pointers, context selection and token counting behind an authenticated loopback API."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "uvicorn>=0.54.0,<0.55",
    "httpx>=0.28,<0.29",
    "tree-sitter>=0.26.0",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
    "mypy>=2,<3",
    "jsonschema>=4.25,<5",
    "rfc3339-validator>=0.1.4,<0.2",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["securecode_context*"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100. Ruff measures Korean characters as width 2, so docstrings and
# comments get a wider lint limit instead of being split mid-sentence.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["securecode_context"]
